# Base configuration. Scenario files `extends:` this file and override keys.
# All numbers below are illustrative defaults for the synthetic dataset.

name: base
description: Default settings shared by all scenarios.
output_dir: outputs

data:
  source: synthetic          # synthetic | csv | odbc
  csv_dir: null              # directory with one CSV per table (source: csv)
  start_date: null           # optional horizon filter, ISO date
  end_date: null
  synthetic:
    n_existing_depots: 6
    n_candidate_depots: 2
    n_zones: 30
    n_products: 3
    n_regions: 3
    start_date: "2025-01-01"
    n_months: 2
    delivery_days_per_month: 4
    seed: 7
    bounding_box: [40.0, 44.0, -2.0, 4.0]   # min_lat, max_lat, min_lon, max_lon

horizon:
  mode: aggregate            # aggregate | full | rolling
  window: M                  # rolling window: M (month) | Q (quarter)
  stop_on_non_optimal: true

costs:
  include_rent: true
  include_fixed_operating: true
  include_opening: true
  include_closing: true
  include_delivery: true
  include_transfer: true
  include_expansion: true
  round_trip_factor: 2.0     # vehicles return empty to the depot
  shortage_penalty: 1.0e+6   # per unit of unmet demand
  one_off_amortisation_months: 60
  horizon_months: null       # inferred from data when null

transport:
  band_width_km: 25
  max_band: 12
  carrier_mix:               # shares must sum to 1
    own_fleet: 0.6
    carrier: 0.4
  road_detour_factor: 1.3
  transfer_distance_basis: road

constraints:
  single_sourcing: {enabled: true}
  assign_only_if_open: {enabled: true}
  inventory_balance:
    enabled: true
    allow_shortage: true
    allow_transfers: true
    integer_quantities: true
  stock_only_if_open: {enabled: true, big_m: null}
  capacity:
    enabled: true
    mode: hard               # hard | soft
    expansion_batch_size: 10
    overrides: {}            # depot_id: capacity (null = unlimited)
  max_service_distance:
    enabled: false
    max_distance_km: null
    max_travel_time_min: null
    distance_basis: road
  open_depot_count:
    enabled: false
    min_open: null
    max_open: null
    max_new_sites: null
    max_closures: null
  forced_status:
    enabled: false
    must_open: []
    must_close: []
    others: free             # free | open | closed
  regional_coverage:
    enabled: false
    min_open_per_region: 1
    per_region: {}

solver:
  name: cbc                  # cbc | highs | gurobi
  time_limit_s: 300
  mip_gap: 0.01
  threads: null
  msg: false
