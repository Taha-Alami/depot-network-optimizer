[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "depot-network-optimizer"
version = "0.1.0"
description = "MILP (PuLP) model for service-depot network design: which depots to keep, close or open, and how to assign customer demand zones."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Taha Alami" }]
requires-python = ">=3.10"
keywords = ["operations-research", "milp", "pulp", "facility-location", "network-design", "supply-chain"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "pulp>=2.8",
    "pandas>=2.0",
    "numpy>=1.24",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
db = ["pyodbc>=5.0"]
highs = ["highspy>=1.7"]
gurobi = ["gurobipy>=11.0"]
dev = ["pytest>=8.0", "ruff>=0.5", "pre-commit>=3.5", "detect-secrets>=1.5"]

[project.scripts]
depot-opt = "depot_opt.cli:main"

[tool.setuptools.packages.find]
include = ["depot_opt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
